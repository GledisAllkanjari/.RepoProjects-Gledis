<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyr — Task Manager</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page {
            display: flex;
            width: 900px;
            min-height: 540px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
        }

        .left {
            flex: 1;
            background: linear-gradient(145deg, #4f46e5, #7c3aed);
            padding: 52px 44px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #fff;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
        }

        .left-body h2 {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 12px;
        }

        .left-body p {
            font-size: 14px;
            opacity: 0.8;
            line-height: 1.6;
        }

        .features {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 14px;
        }

        .right {
            width: 400px;
            background: #fff;
            padding: 52px 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

            .right h1 {
                font-size: 26px;
                font-weight: 700;
                color: #111;
                margin-bottom: 6px;
            }

            .right .sub {
                font-size: 14px;
                color: #6b7280;
                margin-bottom: 32px;
            }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            color: #111;
            outline: none;
            background: #fafafa;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

            input:focus {
                border-color: #4f46e5;
                box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
                background: #fff;
            }

        .btn-main {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 6px;
            transition: opacity 0.2s, transform 0.15s;
        }

            .btn-main:hover {
                opacity: 0.9;
                transform: translateY(-1px);
            }

        .divider {
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            margin: 20px 0;
            position: relative;
        }

            .divider::before, .divider::after {
                content: '';
                position: absolute;
                top: 50%;
                width: 42%;
                height: 1px;
                background: #e5e7eb;
            }

            .divider::before {
                left: 0;
            }

            .divider::after {
                right: 0;
            }

        .link-row {
            text-align: center;
            font-size: 14px;
            color: #6b7280;
        }

            .link-row a {
                color: #4f46e5;
                font-weight: 600;
                text-decoration: none;
            }

        .error-msg {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

            .error-msg.show {
                display: block;
            }
    </style>
</head>
<body>
    <div class="page">
        <div class="left">
            <div class="brand">
                <div class="brand-icon">✓</div>
                <span class="brand-name">TaskManager Pro</span>
            </div>
            <div class="left-body">
                <h2>Menaxho detyrat si profesionist</h2>
                <p>Organizo, prioritizo dhe ndiq progresin e punës çdo ditë.</p>
            </div>
            <div class="features">
                <div class="feature">📋 Detyra me prioritet dhe kategori</div>
                <div class="feature">⏰ Deadline me alarm</div>
                <div class="feature">📊 Statistika dhe grafika live</div>
            </div>
        </div>

        <div class="right">
            <h1>Mirë se erdhe!</h1>
            <p class="sub">Hyr në llogarinë tënde</p>
            <div class="error-msg" id="err"></div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="emri@email.com" />
            </div>
            <div class="form-group">
                <label>Fjalëkalimi</label>
                <input type="password" id="password" placeholder="••••••••" />
            </div>
            <button class="btn-main" onclick="login()">Hyr në llogari</button>
            <div class="divider">ose</div>
            <div class="link-row">Nuk ke llogari? <a href="register.html">Regjistrohu falas</a></div>
        </div>
    </div>
    <script>if (localStorage.getItem('token')) window.location.href = 'index.html';
  document.getElementById('password').addEventListener('keydown', e => { if (e.key==='Enter') login(); });

  async function login() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const err      = document.getElementById('err');
    err.classList.remove('show');
    if (!email || !password) { err.textContent='Plotëso të gjitha fushat.'; err.classList.add('show'); return; }
    try {
      const res = await fetch('/api/auth/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({email, password})
      });
      if (!res.ok) { err.textContent='Email ose fjalëkalim i gabuar.'; err.classList.add('show'); return; }
      const data = await res.json();
      localStorage.setItem('token', data.token);
      localStorage.setItem('username', data.username);
      window.location.href = 'index.html';
    } catch { err.textContent='Gabim lidhje me serverin.'; err.classList.add('show'); }
  }</script>
</body>
</html>
